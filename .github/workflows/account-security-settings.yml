name: Account security Settings layout
on:
  push:
    branches: ['security/stage-3-authorization']
    paths:
      - 'app.html'
      - 'app.js'
      - 'auth.html'
      - 'auth-flows.js'
      - 'business.html'
      - 'business.css'
      - 'styles.css'
      - 'scripts/ci/check-account-security-settings.mjs'
      - '.github/workflows/account-security-settings.yml'

permissions:
  contents: read

jobs:
  browser:
    if: github.repository == 'dwtdhruvp246/mushavobudget'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Install locked Chromium tooling
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix scripts/fixtures/staging-browser-tools
          scripts/fixtures/staging-browser-tools/node_modules/.bin/playwright install --with-deps chromium
      - name: Check desktop and mobile Settings
        run: node scripts/ci/check-account-security-settings.mjs
