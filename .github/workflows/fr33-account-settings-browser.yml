name: FR.3.3 Account Settings browser
on:
  push:
    branches: ['security/stage-3-authorization']
    paths:
      - 'scripts/ci/check-fr33-account-settings-browser.mjs'
      - '.github/workflows/fr33-account-settings-browser.yml'

permissions:
  contents: read

concurrency:
  group: mushavo-staging-acceptance
  cancel-in-progress: false

jobs:
  browser:
    if: github.repository == 'dwtdhruvp246/mushavobudget' && github.ref == 'refs/heads/security/stage-3-authorization'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Install locked browser tooling
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix scripts/fixtures/staging-browser-tools
          scripts/fixtures/staging-browser-tools/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify Account Settings with the staging API
        env:
          MUSHAVO_FR33_BROWSER_TARGET: canonical
          MUSHAVO_STAGING_USER_A_EMAIL: ${{ secrets.MUSHAVO_STAGING_USER_A_EMAIL }}
          MUSHAVO_STAGING_USER_A_PASSWORD: ${{ secrets.MUSHAVO_STAGING_USER_A_PASSWORD }}
          MUSHAVO_STAGING_USER_B_EMAIL: ${{ secrets.MUSHAVO_STAGING_USER_B_EMAIL }}
          MUSHAVO_STAGING_USER_B_PASSWORD: ${{ secrets.MUSHAVO_STAGING_USER_B_PASSWORD }}
        run: node scripts/ci/check-fr33-account-settings-browser.mjs
