name: Mushavo staging proof after account deletion
on:
  push:
    branches: ["security/stage-3-authorization"]
    paths: ["scripts/ci/fr33-proof-run.json"]
permissions:
  contents: read
  statuses: write
concurrency:
  group: mushavo-fr33-proof-acceptance
  cancel-in-progress: true
jobs:
  proof:
    if: github.repository == 'dwtdhruvp246/mushavobudget' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Verify the disposable Family proof before and after uploader erasure
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/fr33-proof-acceptance.mjs
