name: FR.3.3 staging account-deletion requests
on:
  push:
    branches: ['security/stage-3-authorization']
    paths:
      - 'scripts/ci/check-fr33-deletion-requests.mjs'
      - '.github/workflows/fr33-staging.yml'

permissions:
  contents: read

concurrency:
  group: mushavo-staging-acceptance
  cancel-in-progress: false

jobs:
  staging:
    if: github.repository == 'dwtdhruvp246/mushavobudget' && github.ref == 'refs/heads/security/stage-3-authorization'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Verify requests with the two staging test accounts
        env:
          MUSHAVO_STAGING_USER_A_EMAIL: ${{ secrets.MUSHAVO_STAGING_USER_A_EMAIL }}
          MUSHAVO_STAGING_USER_A_PASSWORD: ${{ secrets.MUSHAVO_STAGING_USER_A_PASSWORD }}
          MUSHAVO_STAGING_USER_B_EMAIL: ${{ secrets.MUSHAVO_STAGING_USER_B_EMAIL }}
          MUSHAVO_STAGING_USER_B_PASSWORD: ${{ secrets.MUSHAVO_STAGING_USER_B_PASSWORD }}
        run: node scripts/ci/check-fr33-deletion-requests.mjs
