name: Deploy Mushavo Budget to GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  test:
    name: Verify production release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Run automated checks
        run: node --test tests/*.test.mjs

      - name: Verify custom roles in disposable PostgreSQL
        run: |
          npm install --prefix /tmp/mushavo-role-verification --no-save --package-lock=false @electric-sql/pglite@0.5.8
          MUSHAVO_PGLITE_MODULE=/tmp/mushavo-role-verification/node_modules/@electric-sql/pglite node scripts/verify-business-custom-roles-sql.cjs

      - name: Verify Stage 0 security metadata and private reads
        env:
          MUSHAVO_PGLITE_MODULE: /tmp/mushavo-role-verification/node_modules/@electric-sql/pglite
        run: |
          node scripts/verify-security-stage-0-sql.cjs
          node scripts/verify-security-stage-0-private-reads-sql.cjs
          node scripts/verify-security-stage-0-currency-sql.cjs

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare public website
        run: |
          mkdir -p _site
          cp .nojekyll _site/
          cp about.html app-entry.html app.html business.html contact.html index.html offline.html pricing.html signup.html _site/
          cp app-entry.js app.js admin-plans.js business.js config.js push-notifications.js pwa-install.js pwa.js site.js sw.js workspace-preference.js _site/
          cp business.css pwa-install.css pwa-shell.css pwa-update.css site.css styles.css manifest.webmanifest _site/
          cp -R assets _site/assets

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
