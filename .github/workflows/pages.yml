name: Deploy Mushavo Budget to GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  test:
    name: Verify production release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Run automated checks
        run: node --test tests/*.test.mjs

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare public website
        run: |
          mkdir -p _site
          cp .nojekyll _site/
          cp about.html app-entry.html app.html contact.html index.html offline.html pricing.html signup.html _site/
          cp app-entry.js app.js config.js push-notifications.js pwa-install.js pwa.js site.js sw.js _site/
          cp pwa-install.css pwa-shell.css pwa-update.css site.css styles.css manifest.webmanifest _site/
          cp -R assets _site/assets

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
