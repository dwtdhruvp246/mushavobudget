name: Mushavo staging checks
run-name: Staging authorization checks

on:
  push:
    branches: ["security/stage-3-authorization"]
    paths: ["scripts/ci/staging-run.json"]

permissions:
  contents: read

concurrency:
  group: mushavo-staging-acceptance
  cancel-in-progress: false

jobs:
  staging:
    if: github.repository == 'dwtdhruvp246/mushavobudget' && github.ref == 'refs/heads/security/stage-3-authorization'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout the exact staging source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Verify runner boundaries without credentials
        run: node --test tests/staging-runner-guards.test.mjs tests/staging-recovery-guards.test.mjs tests/business-invitation-delivery.test.mjs
      - name: Select the test scope
        id: scope
        run: |
          echo "controlled=$(node -p 'require("./scripts/ci/staging-run.json").scope === "controlled-browser"')" >> "$GITHUB_OUTPUT"
          echo "business_receipt=$(node -p 'require("./scripts/ci/staging-run.json").scope === "business-receipt-authorization"')" >> "$GITHUB_OUTPUT"
          echo "receipt_cleanup=$(node -p 'require("./scripts/ci/staging-run.json").cleanup_fixture === true')" >> "$GITHUB_OUTPUT"
      - name: Install locked browser tools
        if: steps.scope.outputs.business_receipt != 'true'
        run: npm ci --ignore-scripts --prefix scripts/fixtures/staging-browser-tools
      - name: Install Chromium
        if: steps.scope.outputs.business_receipt != 'true'
        run: scripts/fixtures/staging-browser-tools/node_modules/.bin/playwright install --with-deps chromium
      - name: Run the controlled browser checks
        if: steps.scope.outputs.controlled == 'true'
        run: node scripts/ci/check-staging.mjs
      - name: Prepare the exact disposable Business workspace
        id: receipt_fixture
        if: steps.scope.outputs.business_receipt == 'true' && steps.scope.outputs.receipt_cleanup != 'true'
        env:
          MUSHAVO_STAGING_RECEIPT_ADMIN_ACTION: provision
          MUSHAVO_STAGING_USER_A_EMAIL: ${{ secrets.MUSHAVO_STAGING_USER_A_EMAIL }}
          MUSHAVO_STAGING_USER_A_PASSWORD: ${{ secrets.MUSHAVO_STAGING_USER_A_PASSWORD }}
          MUSHAVO_STAGING_ADMIN_EMAIL: ${{ secrets.MUSHAVO_STAGING_ADMIN_EMAIL }}
          MUSHAVO_STAGING_ADMIN_PASSWORD: ${{ secrets.MUSHAVO_STAGING_ADMIN_PASSWORD }}
        run: node scripts/ci/check-staging.mjs
      - name: Run the selected Business receipt checks
        if: steps.scope.outputs.business_receipt == 'true'
        env:
          MUSHAVO_STAGING_USER_A_EMAIL: ${{ secrets.MUSHAVO_STAGING_USER_A_EMAIL }}
          MUSHAVO_STAGING_USER_A_PASSWORD: ${{ secrets.MUSHAVO_STAGING_USER_A_PASSWORD }}
          MUSHAVO_STAGING_USER_B_EMAIL: ${{ secrets.MUSHAVO_STAGING_USER_B_EMAIL }}
          MUSHAVO_STAGING_USER_B_PASSWORD: ${{ secrets.MUSHAVO_STAGING_USER_B_PASSWORD }}
        run: node scripts/ci/check-staging.mjs
      - name: Suspend the test workspace after receipt cleanup
        if: always() && steps.scope.outputs.business_receipt == 'true' && (steps.receipt_fixture.outcome == 'success' || steps.scope.outputs.receipt_cleanup == 'true')
        env:
          MUSHAVO_STAGING_RECEIPT_ADMIN_ACTION: suspend
          MUSHAVO_STAGING_USER_A_EMAIL: ${{ secrets.MUSHAVO_STAGING_USER_A_EMAIL }}
          MUSHAVO_STAGING_USER_A_PASSWORD: ${{ secrets.MUSHAVO_STAGING_USER_A_PASSWORD }}
          MUSHAVO_STAGING_ADMIN_EMAIL: ${{ secrets.MUSHAVO_STAGING_ADMIN_EMAIL }}
          MUSHAVO_STAGING_ADMIN_PASSWORD: ${{ secrets.MUSHAVO_STAGING_ADMIN_PASSWORD }}
        run: node scripts/ci/check-staging.mjs
      - name: Run the selected staging checks
        if: steps.scope.outputs.controlled != 'true' && steps.scope.outputs.business_receipt != 'true'
        env:
          MUSHAVO_STAGING_USER_A_EMAIL: ${{ secrets.MUSHAVO_STAGING_USER_A_EMAIL }}
          MUSHAVO_STAGING_USER_A_PASSWORD: ${{ secrets.MUSHAVO_STAGING_USER_A_PASSWORD }}
          MUSHAVO_STAGING_USER_B_EMAIL: ${{ secrets.MUSHAVO_STAGING_USER_B_EMAIL }}
          MUSHAVO_STAGING_USER_B_PASSWORD: ${{ secrets.MUSHAVO_STAGING_USER_B_PASSWORD }}
          MUSHAVO_STAGING_ADMIN_EMAIL: ${{ secrets.MUSHAVO_STAGING_ADMIN_EMAIL }}
          MUSHAVO_STAGING_ADMIN_PASSWORD: ${{ secrets.MUSHAVO_STAGING_ADMIN_PASSWORD }}
        run: node scripts/ci/check-staging.mjs
