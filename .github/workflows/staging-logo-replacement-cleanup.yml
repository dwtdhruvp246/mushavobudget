name: Staging Business logo replacement cleanup
on:
  push:
    branches: ["security/stage-3-authorization"]
    paths: ["scripts/ci/staging-logo-replacement-cleanup-run.json"]
permissions:
  contents: read
concurrency:
  group: mushavo-staging-acceptance
  cancel-in-progress: false
jobs:
  logo:
    if: github.repository == 'dwtdhruvp246/mushavobudget' && github.ref == 'refs/heads/security/stage-3-authorization' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Verify cleanup services
        run: node --test tests/business-logo-replacement-cleanup.test.mjs tests/business-cleanup-scheduler.test.mjs tests/business-ingestion-lifecycle-handler.test.mjs
      - name: Verify replacement cleanup through the signed scheduler
        env:
          MUSHAVO_STAGING_USER_A_EMAIL: ${{ secrets.MUSHAVO_STAGING_USER_A_EMAIL }}
          MUSHAVO_STAGING_USER_A_PASSWORD: ${{ secrets.MUSHAVO_STAGING_USER_A_PASSWORD }}
          MUSHAVO_STAGING_USER_B_EMAIL: ${{ secrets.MUSHAVO_STAGING_USER_B_EMAIL }}
          MUSHAVO_STAGING_USER_B_PASSWORD: ${{ secrets.MUSHAVO_STAGING_USER_B_PASSWORD }}
          MUSHAVO_STAGING_ADMIN_EMAIL: ${{ secrets.MUSHAVO_STAGING_ADMIN_EMAIL }}
          MUSHAVO_STAGING_ADMIN_PASSWORD: ${{ secrets.MUSHAVO_STAGING_ADMIN_PASSWORD }}
        run: node scripts/ci/check-staging-logo-replacement-cleanup.mjs
